<!doctype html>
<html lang="uk">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <script>
            // Apply the theme before first paint, so a light-mode visitor never sees a dark flash.
            // Same rules as src/theme.ts: a stored 'light'/'dark' wins, anything else follows the OS.
            (function () {
                var stored;
                try {
                    stored = localStorage.getItem('searcher:theme');
                } catch (e) {}
                var dark =
                    stored === 'dark' ||
                    (stored !== 'light' &&
                        matchMedia('(prefers-color-scheme: dark)').matches);
                document.documentElement.classList.toggle('dark', dark);
            })();
        </script>
        <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Forum&family=Inter:wght@400;500;600;700&display=swap"
        />
        <title>MTG UA Community Card Searcher</title>
        <meta
            name="description"
            content="Вставте список карт Magic: The Gathering і порівняйте ціни в українських магазинах одразу: найкраща ціна для кожної карти й найдешевша сума за всю колоду."
        />
        <!-- The link preview in Telegram and other messengers. Crawlers need absolute URLs; the image is
             src/og-image.png, rendered by scripts/render-og-image.ts and served by src/index.ts. -->
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="MTG UA Community" />
        <meta property="og:url" content="https://aggregator.chz.name/" />
        <meta property="og:title" content="MTG UA Community Card Searcher" />
        <meta
            property="og:description"
            content="Вставте список карт Magic: The Gathering і порівняйте ціни в українських магазинах одразу: найкраща ціна для кожної карти й найдешевша сума за всю колоду."
        />
        <meta property="og:locale" content="uk_UA" />
        <meta
            property="og:image"
            content="https://aggregator.chz.name/og-image.png"
        />
        <meta property="og:image:type" content="image/png" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta
            property="og:image:alt"
            content="MTG UA Community Card Searcher: порівняння цін на карти в українських магазинах"
        />
        <meta name="twitter:card" content="summary_large_image" />
        <script type="module" src="./frontend.tsx" async></script>
    </head>
    <body>
        <div id="root"></div>
    </body>
</html>
