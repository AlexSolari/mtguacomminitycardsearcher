<!doctype html>
<html lang="uk">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <script>
            // Apply the theme before first paint, so a light-mode visitor never sees a dark flash.
            // Same rules as src/theme.ts: a stored 'light'/'dark' wins, anything else follows the OS.
            (function () {
                var stored;
                try {
                    stored = localStorage.getItem('searcher:theme');
                } catch (e) {}
                var dark =
                    stored === 'dark' ||
                    (stored !== 'light' &&
                        matchMedia('(prefers-color-scheme: dark)').matches);
                document.documentElement.classList.toggle('dark', dark);
            })();
        </script>
        <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Forum&family=Inter:wght@400;500;600;700&display=swap"
        />
        <title>MTG UA Community Card Searcher</title>
        <script type="module" src="./frontend.tsx" async></script>
    </head>
    <body>
        <div id="root"></div>
    </body>
</html>
